name: R-CMD-check

# Temporarily disabled - data files not in repo, tests need updating
on:
  push:
    branches: [ never ]  # Disabled
  pull_request:
    branches: [ never ]  # Disabled

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      
    steps:
      - uses: actions/checkout@v4
      
      - uses: r-lib/actions/setup-pandoc@v2
      
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0'
          use-public-rspm: true
          
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev
          
      - uses: r-lib/actions/setup-renv@v2
        with:
          working-directory: surgical-cognitive-dashboard-1
          
      - name: Run tests
        run: |
          cd surgical-cognitive-dashboard-1
          Rscript -e "library(testthat); test_dir('tests')"
          
      - name: Check basic pipeline
        run: |
          cd surgical-cognitive-dashboard-1
          Rscript -e "source('scripts/00_setup.R'); cat('Setup completed successfully\n')"
